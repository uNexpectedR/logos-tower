name: Board relay (logos.dev)

# Runs the Next.js /api/scores relay behind a Cloudflare quick tunnel so
# Basecamp can fetch/publish verified logos.dev scores. Also refreshes the
# public board.json snapshot on the `board` release.

on:
  schedule:
    - cron: "5 */4 * * *"
  workflow_dispatch: {}

concurrency:
  group: board-relay
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 225
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build Next.js relay
        run: npm run build

      - name: Install cloudflared
        run: |
          curl -fsSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared

      - name: Start Next.js
        run: |
          npm start > next.log 2>&1 &
          echo $! > next.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/api/status >/dev/null 2>&1 \
               || curl -fsS http://127.0.0.1:3000/api/scores >/dev/null 2>&1; then
              echo "next up"
              exit 0
            fi
            sleep 2
          done
          echo "next failed to start" >&2
          cat next.log >&2 || true
          exit 1

      - name: Open Cloudflare quick tunnel
        run: |
          ./cloudflared tunnel --url http://127.0.0.1:3000 > tunnel.log 2>&1 &
          echo $! > tunnel.pid
          for i in $(seq 1 60); do
            url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' tunnel.log | head -1 || true)
            if [ -n "$url" ]; then
              echo "RELAY_URL=$url" >> "$GITHUB_ENV"
              echo "tunnel url: $url"
              exit 0
            fi
            sleep 2
          done
          echo "tunnel URL not found" >&2
          cat tunnel.log >&2 || true
          exit 1

      - name: Snapshot board + publish relay pointer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:3000/api/scores -o board.json
          jq -n --arg url "$RELAY_URL" --arg updated "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{url:$url, boardPath:"/api/scores", scoresPath:"/api/scores", updatedAt:$updated}' > relay.json
          if ! gh release view board >/dev/null 2>&1; then
            gh release create board --title "Logos Tower public board" --notes "Rolling public board + relay pointer for Basecamp." --latest=false
          fi
          gh release upload board board.json relay.json --clobber

      - name: Keep relay alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          end=$((SECONDS + 210 * 60))
          while [ $SECONDS -lt $end ]; do
            sleep 300
            if ! kill -0 "$(cat next.pid)" 2>/dev/null; then
              echo "next died" >&2
              cat next.log >&2 || true
              exit 1
            fi
            curl -fsS http://127.0.0.1:3000/api/scores -o board.json || true
            gh release upload board board.json --clobber || true
          done
